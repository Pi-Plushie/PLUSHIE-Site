<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0">

    <title>PLUSHIE — Curieux</title>
    <script data-goatcounter="https://plushie.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>

    <link rel="stylesheet" href="Style-presentations.css">
    <link rel="preconnect"
          href="https://fonts.googleapis.com">


    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>


    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap"
          rel="stylesheet">
    <script src="code-presentations.js" defer></script>
</head>

<body>

    <a href="../index.html" title="Retour au menu principal">
        <img src="../Logo Lapin PLUSHIE.png" id="logo">
    </a>

    <div id="presentation">


        <!-- SLIDE 1 -->

        <div class="slide active">

            <h1>
                PLUSHIE <br><span class="cursor"> ☾_✦ </span>
            </h1>

            <p>
                Des structures se cherchent.
            </p>


        </div>


        <!-- SLIDE 2 -->

        <div class="slide">

            <h1>
                Des cycles apparaissent.
            </h1>
            <div class="cycle">

                <div class="arrow">

                    →

                </div>

            </div>
            


        </div>



            <!-- SLIDE 3 -->

        <div class="slide">

            <h1>
                Des formes persistent.
            </h1>
            <div class="cellule">
                <div class="case">☾</div>
                <div class="case">✦</div>
            </div>

        </div>


            <!-- SLIDE 4 -->

            <div class="slide">

                <div class="quote">

                    La mémoire rêve.

                </div>

            </div>


            <!-- SLIDE 5 -->

            <div class="slide">

                <h1>
                    Ouvrez la porte de l'infini de PLUSHIE
                </h1>

                <p>
                    PLUSHIE, une source d'inspiration
                </p>

                <button id="enter-button"
                        onclick="window.location.href='../index.html'">

                    Entrer

                </button>

            </div>

    


    <div id="footer">

        présentation expérimentale — PLUSHIE

    </div>


</body>
</html>
